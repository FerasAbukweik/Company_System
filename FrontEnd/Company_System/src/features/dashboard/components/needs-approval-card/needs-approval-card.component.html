<div
  class=""
>
  <div class="flex justify-between items-start mb-4">
    <div class="text-lg flex items-center gap-2">
      <div>
        <p class="font-bold text-corporate-blue">{{ approval().requesterName }}</p>
      </div>
    </div>
  </div>
  <div class="flex flex-wrap justify-between gap-x-4 gap-y-2 mb-4">
    <p class="text-text-primary line-clamp-2">{{ approval().body }}</p>
    <p class="text-sm">{{ approval().createdOn | date: 'd/M/y h:m a' }}</p>
  </div>
  <div class="flex gap-2">
    <button
      (click)="approvalService.updateStatus(approval().id, 1)"
      class="cursor-pointer flex-1 py-2 rounded-lg border border-outline-light text-xs font-bold hover:bg-surface-low transition-colors text-text-primary"
    >
      Reject
    </button>
    <button
      (click)="approvalService.updateStatus(approval().id, 0)"
      class="cursor-pointer flex-1 py-2 rounded-lg bg-corporate-blue text-surface-lowest text-xs font-bold hover:opacity-90 transition-opacity"
    >
      Approve
    </button>
  </div>
</div>
