<div
  class="absolute -left-12 top-4 flex items-center justify-center border-4 border-surface-lowest z-10"
>
  <app-icon class="size-8" [path]="getActivityIcon(activity().type)" />
</div>
<div class="bg-surface-base p-4 rounded-lg border border-outline-light">
  <p class="text-sm text-text-primary">
    <span class="font-bold">{{ activity().title }}<br /></span>
    <span class="whitespace-pre-line">{{ activity().description }}</span>
  </p>
  <span class="text-xs text-text-secondary mt-1 block">{{
    activity().createdAt | date: 'd/M/y h:m a'
  }}</span>
</div>
