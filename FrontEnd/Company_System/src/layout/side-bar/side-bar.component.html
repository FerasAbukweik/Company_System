@for (item of navItems(); track item.label) {
  <a
    [routerLink]="item.route"
    routerLinkActive
    #rla="routerLinkActive"
    [class]="
      rla.isActive
        ? 'whitespace-nowrap flex items-center gap-4 p-4 rounded-lg text-corporate-blue font-bold border-r-2 border-vibrant-turquoise bg-surface-high transition-colors mb-2'
        : 'whitespace-nowrap flex items-center gap-4 p-4 rounded-lg text-text-secondary hover:bg-surface-low transition-colors active:scale-[0.98] duration-150 mb-2'
    "
    (click)="$event.preventDefault()"
  >
    <span class="material-symbols-outlined"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
        />
      </svg>
    </span>
    <span class="text-sm font-medium">{{ item.label }}</span>
  </a>
}
