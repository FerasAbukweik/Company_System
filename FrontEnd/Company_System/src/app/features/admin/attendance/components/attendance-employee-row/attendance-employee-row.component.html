<td class="p-4 font-medium text-corporate-blue">
  {{ employee().fullName }}
  @if (!employee().record) {
    <span class="mt-1 block text-xs font-normal text-text-secondary">Not recorded</span>
  }
</td>
<td class="p-4" [formGroup]="form">
  <input
    type="time"
    formControlName="clockIn"
    (focus)="defaultTime('clockIn')"
    [attr.aria-label]="'Clock-in for ' + employee().fullName"
    class="rounded-lg border border-outline-light bg-surface-lowest p-2"
  />
</td>
<td class="p-4" [formGroup]="form">
  <input
    type="time"
    formControlName="clockOut"
    (focus)="defaultTime('clockOut')"
    [attr.aria-label]="'Clock-out for ' + employee().fullName"
    class="rounded-lg border border-outline-light bg-surface-lowest p-2"
  />
</td>
<td class="p-4" [formGroup]="form">
  <select
    formControlName="state"
    [attr.aria-label]="'Attendance state for ' + employee().fullName"
    class="min-w-36 rounded-lg border border-outline-light bg-surface-lowest p-2"
  >
    @for (state of states; track state; let index = $index) {
      <option [ngValue]="index">{{ state }}</option>
    }
  </select>
</td>
<td class="p-4">
  <button
    type="button"
    [disabled]="disabled() || saving() || form.invalid"
    (click)="save()"
    class="rounded-lg bg-corporate-blue px-4 py-2 text-surface-lowest disabled:opacity-50"
  >
    {{ saving() ? 'Saving…' : employee().record ? 'Update' : 'Save' }}
  </button>
</td>
