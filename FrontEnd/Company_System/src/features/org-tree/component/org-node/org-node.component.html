<div class="flex flex-col items-center relative">
  <div
    [class.outline]="node().isCurrUser"
    [class.outline-2]="node().isCurrUser"
    [class.outline-vibrant-turquoise]="node().isCurrUser"
    class="group p-4 bg-surface-lowest border border-outline-light rounded-xl shadow-sm w-64 transition-all"
  >
    <div class="flex items-center gap-3">
      <div
        class="overflow-hidden w-11 h-11 rounded-full bg-corporate-blue/5 border border-corporate-blue/10 flex items-center justify-center font-bold text-corporate-blue text-sm uppercase tracking-wider shrink-0"
      >
        <img
          [src]="node().userImageUrl"
          [alt]="node().userName"
          (error)="$event.target.src = 'user_vector.jpg'"
        />
      </div>
      <div class="min-w-0">
        <p class="font-bold text-corporate-blue truncate">{{ node().userName }}</p>
        <p class="text-xs text-text-secondary font-medium truncate">{{ displayRole }}</p>
      </div>
    </div>

    <div
      class="flex justify-end items-center gap-2 material-symbols-outlined text-text-secondary opacity-0 group-hover:opacity-100 transition-opacity text-base"
    >
      @if (!node().isCurrUser) {
        <button
          class="hover:bg-gray-100 p-2 rounded-xl cursor-pointer"
          (click)="chatPanelService.open(node())"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"
            />
          </svg>
        </button>
      }

      @if (isCurrUserChild()) {
        <button
          class="hover:bg-gray-100 p-2 rounded-xl cursor-pointer"
          (click)="delegateTaskService.open(node())"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
            />
          </svg>
        </button>
      }
    </div>
  </div>

  @if (node().children && node().children.length > 0) {
    <div class="h-8 w-0.5 bg-corporate-blue/20"></div>

    <div class="relative flex gap-8 px-4">
      @if (node().children.length > 1) {
        <div class="absolute top-0 left-[12.5%] right-[12.5%] h-0.5 bg-corporate-blue/20"></div>
      }

      @for (child of node().children; track child.id) {
        <app-org-node [node]="child" [isCurrUserChild]="isCurrUserChild() || node().isCurrUser" />
      }
    </div>
  }
</div>
