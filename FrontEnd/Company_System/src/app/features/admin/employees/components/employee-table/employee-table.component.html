<table class="w-full text-left border-collapse">
  <thead>
    <tr
      class="bg-surface-low text-text-secondary text-xs font-medium uppercase tracking-wider select-none"
    >
      <th class="py-4 px-6 w-12 text-center">
        <input
          type="checkbox"
          class="size-4 rounded cursor-pointer accent-vibrant-turquoise"
          aria-label="Select all employees on this page"
          [checked]="isAllSelected()"
          (change)="toggleAll($any($event.target).checked)"
        />
      </th>
      <th class="py-4 px-6">Employee Directory</th>
      <th class="py-4 px-6">Position</th>
      <th class="py-4 px-6">Hourly Rate</th>
      <th class="py-4 px-6">Active</th>
      <th class="py-4 px-6 text-right">Actions</th>
    </tr>
  </thead>
  <tbody class="text-sm text-text-primary">
    @for (employee of employees(); track employee.id; let index = $index) {
      <tr
        app-employee-row
        [employee]="employee"
        [selected]="isSelected(employee.id)"
        [menuOpensUp]="opensMenuUp(index)"
        (selectedChange)="toggleOne(employee.id, $event)"
        (edit)="edit.emit(employee)"
        (action)="rowAction.emit({ employee, action: $event })"
      ></tr>
    } @empty {
      <tr>
        <td colspan="6" class="py-16 text-center text-lg font-bold text-text-secondary">
          No employees match your filters
        </td>
      </tr>
    }
  </tbody>
</table>
