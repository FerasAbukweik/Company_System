<div class="text-text-primary h-screen w-full relative overflow-auto font-sans">
  <div class="w-full p-8 custom-scrollbar">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-corporate-blue">Organizational Structure</h2>
      <p class="text-text-secondary">
        Visualize and manage your team hierarchy and task delegation.
      </p>
    </div>
    <div class="relative flex flex-col items-center py-6 w-fit min-w-full mx-auto">
      @if (orgTreeService.getTreeRoot()) {
        <app-org-node [node]="orgTreeService.getTreeRoot()!" [isCurrUserChild]="false" />
      } @else {
        <span class="font-bold text-text-primary text-xl">Something Is Wrong</span>
      }
      @if (orgTreeService.getIsLoadingTree()) {
        <app-loading class="scale-125 mt-10" [loadingName]="'Users'" />
      }
      <div (appIsVisable)="orgTreeService.loadMoreTree()"></div>
    </div>
  </div>
</div>

<app-delegate-task />

<app-chat-panel />
@if (delegateTaskService.getIsShowDelegateTask() || chatPanelService.getIsVisable()) {
  <div class="absolute inset-0" (click)="delegateTaskService.close(); chatPanelService.close()"></div>
}
