@for (item of navItems(); track item.label) {
  <a
    [routerLink]="item.route"
    routerLinkActive
    #rla="routerLinkActive"
    [class]="
      rla.isActive
        ? 'whitespace-nowrap flex items-center gap-4 p-4 rounded-lg text-corporate-blue font-bold border-r-2 border-vibrant-turquoise bg-surface-high transition-colors mb-2'
        : 'whitespace-nowrap flex items-center gap-4 p-4 rounded-lg text-text-secondary hover:bg-surface-low transition-colors active:scale-[0.98] duration-150 mb-2'
    "
    (click)="$event.preventDefault(); hanleOnLinkClick()"
  >
    <span class="material-symbols-outlined"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          [attr.d]="item.icon"
        />
      </svg>
    </span>
    <span class="text-sm font-medium">{{ item.label }}</span>
  </a>
}
